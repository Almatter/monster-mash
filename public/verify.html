<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify a Run · Monster Mash</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><style>body{overflow:auto;background:#100f14}.verify-panel{margin:4vh auto;max-width:760px}.verify-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin:20px 0}.verify-grid div{border-bottom:1px solid #45343a;padding:8px 0}.verify-grid dt{color:#a19a94;font-size:10px;letter-spacing:1px}.verify-grid dd{margin:5px 0 0;font-size:18px;font-weight:bold}.verify-note{font-size:11px}textarea{display:block;width:100%;min-height:150px;margin:12px 0;padding:12px;background:#19161e;border:1px solid #6d4e4c;color:#eee7d8;overflow-wrap:anywhere}#status{font-weight:bold;letter-spacing:1px}details{margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#a8a0a1}@media(max-width:600px){.verify-panel{margin:0;min-height:100vh}.verify-grid{gap:4px 10px}.verify-grid dd{font-size:15px}}</style></head><body><main class="panel verify-panel"><span class="eyebrow">MONSTER MASH · ORGANIZER CHECK</span><h1 style="font-size:36px;letter-spacing:1px;line-height:1.1">VERIFY A RUN</h1><p>Paste a result code to inspect its score, champion and ruleset.</p><label for="code">RUN CODE</label><textarea id="code" maxlength="10000" spellcheck="false" autocomplete="off"></textarea><button id="verify" class="primary">VERIFY RUN</button><p id="status" role="status" aria-live="polite">Awaiting run code.</p><dl id="output" class="verify-grid" hidden></dl><details id="technical" hidden><summary>Technical details</summary><pre id="raw"></pre></details><p class="verify-note">Client-side verification detects malformed or casually modified codes. It is not authoritative anti-cheat.</p><a href="">Return to Monster Mash</a></main><script type="module" src="src/verify.js"></script></body></html>
